[item-description]
RTZiplineTrolley=Dieses motorisierte Seilrutschen-Fahrzeug wird mit dem Strom betrieben, der durch das Kabel fließt, auf dem es fährt. Rüsten Sie es mit einem Controller aus, wählen Sie es aus und drücken Sie Interagieren (Standard F) an einem Strommast, um die Fahrt zu starten, und drücken Sie erneut, um abzusteigen. Steigt automatisch an Endpunkten ab.\nVerbraucht 450 kW Strom.
RTZiplineTrolley2=Doppelt so schnell wie die normale Seilrutsche! Verbraucht 1 MW Strom. Grafikdesign ist meine Leidenschaft :)
RTZiplineTrolley3=Doppelt so schnell wie die schnelle Seilrutsche! Verbraucht 5 MW Strom.
RTZiplineTrolley4=Doppelt so schnell wie die Hochgeschwindigkeits-Seilrutsche! Verbraucht 10 MW Strom.
RTZiplineTrolley5=Viel schneller als die Express-Seilrutsche! Können Sie bei dieser Geschwindigkeit überhaupt lenken? Verbraucht 50 MW Strom.
RTZiplineControls=Rüsten Sie ein Paar dieser Steuerungen im Munitionsslot der elektrischen Seilrutsche aus, um ihre Bewegung zu kontrollieren.
RTZiplineCrankControls=Halten Sie die Feuertaste gedrückt, während Sie die Seilrutsche benutzen, um einen zusätzlichen Geschwindigkeitsschub zu erhalten. Muss nach einer Weile ersetzt werden.
RTProgrammableZiplineControls=Diese Steuerungen können programmiert werden, um Sie automatisch zwischen zwei Seilrutschen-Terminals zu bewegen, ohne dass Sie steuern müssen.
RTLickmawBalls=Diese saftige Frucht ist ein großer Hit bei Sawcon.\n\nWährend eines Entwickler-Q&As auf der Space Age LAN-Party wurde bekannt gegeben, dass diese Früchte zu einem bestimmten Zeitpunkt während der Entwicklung tatsächlich im Spiel waren. Kritiker betrachten ihre Entfernung als den mit Abstand größten Fehler der Erweiterung und als den einzigen Grund, der verhindert, dass die Erweiterung multiversale Anerkennung erlangt.
RTAIZiplineControls=Mit diesem Controller lässt sich eine elektrische Seilbahn zu jedem Strommast im Stromnetz steuern. Schwebe auf der Seilbahn über einen beliebigen Strommast und drücke die Seilbahn-Taste, um automatisch dorthin zu fahren.

RTItemShellItem=Wird verwendet, um Stapel von Gegenständen aus elektromagnetischen Gegenstandskanonen abzufeuern


