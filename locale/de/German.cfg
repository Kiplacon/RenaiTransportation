[mod-setting-description]
RTStreamSetting=Geworfene Gegenstände werden als Projektile in Form von Spielobjekten dargestellt, was weniger Verzögerungen verursacht. Bei deaktivierter Einstellung werden geworfene Gegenstände als herumwirbelnde Sprites dargestellt, was mehr Spaß macht und keine Entitätsplätze für Spielobjekte beansprucht, jedoch zu stärkeren Verzögerungen führt. Durch Ändern dieser Einstellung werden alle derzeit in der Luft befindlichen Gegenstände gelöscht.
RTBounceSetting=Schaltungs-Sprungplatte und Primer-Sprungplatte
RTZiplineSmoothSetting=Bei höheren Geschwindigkeiten und näher zusammenliegenden Masten kann die schwankende Kamerabewegung für einige Personen schwindelerregend wirken.
RTModdedThrowers=Ermöglicht Werfervarianten von Mod-Greifarmen. Andernfalls werden nur Vanilla-Greifarme-Werfer erstellt.
RTThrowersDynamicRange=Die Reichweite von Werfer-Greifarme wird basierend auf der ursprünglichen Einfüge-Reichweite des Greifarms berechnet. (Andernfalls haben alle Werfer eine Reichweite von 15, mit Ausnahme des Langarm-Greifarms, der unabhängig von anderen Mods eine Reichweite von 25 hat.)
RTOverflowComp=Schaltet die Logik ein oder aus, die hilft, Überläufe von Werfern zu minimieren, die Gegenstände überall verschütten. Technisch gesehen haben Transportbänder ein „Inventar“ von 8 Plätzen, was bedeutet, dass Stapel-Greifarm mit >8 Gegenständen in der Hand niemals auf ein Band werfen werden.
RTOverflowTimeout=Wenn die Überlaufverhinderung aktiviert ist, gibt dieser Wert die Zeit in Sekunden an, die ein „Wurfarm“ jedes Mal wartet, wenn er keinen freien Platz im Zielinventar findet, bevor er erneut prüft. Dies dient dazu, Verzögerungen durch ständige Überprüfungen auf freien Platz zu begrenzen.
RTSpillSetting=Spill - Wenn ein geworfener Gegenstand nicht passt, wird er auf den Boden fallen gelassen.\nSpill and mark - Auf den Boden fallen lassen und für Roboter markieren.\nDestroy - Den Gegenstand zerstören, wenn er nicht passt, gegen eine Verschmutzungsgebühr.
RTThrowersSetting=Aktiviert die Basisfunktionen von Werfer-Greifarm, Sprungplatten, Spielerwerfern und Klappen. Muss aktiviert sein, damit Mod-Werfer erstellt werden.
RTImpactGrouping=Maximale Anzahl von Projektilen, die für jeden Gegenstandstyp in einem Aufprallwagen erstellt werden. Weniger Projektile helfen, Verzögerungen zu reduzieren, sehen aber weniger cool aus.
RTShowRange=Die Reichweitenanzeige für Sprungplatten im Alt-Modus kann durch Klicken auf die Sprungplatte ein- oder ausgeschaltet werden. Diese Einstellung legt fest, ob sie standardmäßig sichtbar ist, wenn sie gebaut werden.
RTChestPop=Die Hälfte der Gegenstände in einer Truhe oder einem Fahrzeug springt heraus und verstreut sich auf dem Boden, wenn diese zerstört werden.
RTTrapdoorSetting=Wenn Zugrampen aktiviert sind, werden auch Falltür-Schaltrampen aktiviert.
MiningSpeedDebuffTime=Nach dem Entfernen eines Objekts, das sich häufig mit einem anderen überlappt (Klappen, Zugrampen), wird deine Abbaugeschwindigkeit für diese Dauer verlangsamt, um zu verhindern, dass du versehentlich das darunter liegende Objekt entfernst.
RTZiplineDisablesBotsSetting=Legt fest, ob das Besteigen von Seilbahnen automatisch die persönlichen Roboterhanger deaktiviert. Wenn diese Option aktiviert ist, werden deine persönlichen Roboterhanger-Einstellungen beim Verlassen der Seilbahn auf den Stand vor dem Besteigen der Seilbahn zurückgesetzt.

[virtual-signal-name]
DirectorBouncePlateUp=Nach oben abprallen
DirectorBouncePlateRight=Nach rechts abprallen
DirectorBouncePlateDown=Nach unten abprallen
DirectorBouncePlateLeft=Nach links abprallen
ThrowerRangeSignal=Wurfreichweite
StationTrapdoorWagonSignal=Falltüren umschalten


[virtual-signal-description]
DirectorBouncePlateUp=Lege ein Objekt in diesem Slot fest, damit es nach der Landung auf dieser Sprungplatte nach oben abprallt
DirectorBouncePlateRight=Lege ein Objekt in diesem Slot fest, damit es nach der Landung auf dieser Sprungplatte nach rechts abprallt
DirectorBouncePlateDown=Lege ein Objekt in diesem Slot fest, damit es nach der Landung auf dieser Sprungplatte nach unten abprallt
DirectorBouncePlateLeft=Lege ein Objekt in diesem Slot fest, damit es nach der Landung auf dieser Sprungplatte nach links abprallt
ThrowerRangeSignal=Wurfarme, die dieses Signal empfangen, passen ihre Reichweite an den Signalwert an. Befindet sich dieses Signal sowohl auf dem roten als auch auf dem grünen Draht, werden die Werte addiert. Die Reichweite kann nicht über die Grenze des Werfers hinaus angepasst werden.
StationTrapdoorWagonSignal=Wenn an einer Bahnhaltestelle dieses [virtual-signal=StationTrapdoorWagonSignal]-Signal anliegt, wechseln alle Falltürwagen in Zügen, die dort halten, bei der Ankunft ihren Öffnungs-/Schließzustand und kehren bei der Abfahrt wieder in den ursprünglichen Zustand zurück.

