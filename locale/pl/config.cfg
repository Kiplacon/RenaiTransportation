RTTrainRampSetting=Włącz rampy kolejowe. Włącza również wagony ładunkowe, jeśli włączono rzuty z możliwością ustawiania
RTMagRampRange=Maksymalny zasięg rampy magnetycznej
RTTrainBounceSetting=|-Włącz podkładki odbijające dla pociągów (wymagane rampy kolejowe)
RTImpactSetting=Włącz wagony uderzeniowe i rozładowki uderzeniowe
RTZiplineSetting=Włącz elektryczne tyrolki
RTZiplineSmoothSetting=Ruch tyrolki
RTModdedThrowers=|-Włącz zmodyfikowane warianty miotaczy (wymaga włączenia podstawowych miotaczy)
RTThrowersDynamicRange=|-Włącz obliczanie zasięgu miotaczy
