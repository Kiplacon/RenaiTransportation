RTShowRange=Pokaż wskaźnik zasięgu podczas budowy
RTChestPop=Przedmioty wyskakują ze zniszczonych skrzyń/pojazdów
RTVehicleCharacterKnockback=Pojazdy odrzucają graczy do tyłu przy uderzeniu
RTPlatformLooseItems=Luźne przedmioty na platformach kosmicznych odlatują podczas startu
RTTrapdoorSetting=Włącz wagony z klapą
RTItemCannonSetting=|-Włącz armaty przedmiotów, panele rykoszetowe i zrzuty
MiningSpeedDebuffTime=Czas trwania osłabienia prędkości wydobywania nakładających się obiektów (w sekundach)
RTZiplineDisablesBotsSetting=Tyrolka wyłącza osobiste roboporty

[mod-setting-description]
RTStreamSetting=Rzucane przedmioty są przedstawiane jako pociski w postaci obiektów gry, co powoduje mniejsze opóźnienia. Po wyłączeniu tej opcji rzucane przedmioty są renderowane jako spadające sprite'y, co jest bardziej zabawne i nie zajmuje miejsc na obiekty gry, ale powoduje większe opóźnienia. Zmiana tego ustawienia spowoduje usunięcie wszystkich przedmiotów znajdujących się obecnie w locie.
RTBounceSetting=Podkładka odbijająca obwodowa i podstawowa podkładka odbijająca
RTZiplineSmoothSetting=Przy większych prędkościach i bliżej siebie umieszczonych słupach ruch kamery może powodować zawroty głowy u niektórych osób.
RTModdedThrowers=Włącza warianty miotaczy zmodyfikowanych podajników, w przeciwnym razie tworzone są tylko podajniki miotające w wersji podstawowej.
RTThrowersDynamicRange=Zasięg miotaczy będzie obliczany na podstawie zasięgu wkładania oryginalnego podajnika. (W przeciwnym razie wszystkie miotacze będą miały zasięg 15, z wyjątkiem podajnika o długim ramieniu, który ma zasięg 25 niezależnie od innych modów)
RTOverflowComp=Włącza lub wyłącza logikę, która pomaga zminimalizować przepełnienie spowodowane rozrzucaniem przedmiotów przez miotacze. Pod względem obliczeniowym taśmy transportowe mają „ekwipunek” składający się z 8 slotów, co oznacza, że podajniki stosowe z >8 przedmiotami w ręku, celujące w taśmę, nigdy nie będą rzucać.
RTOverflowTimeout=Jeśli zapobieganie przepełnieniu jest włączone, jest to czas w sekundach, przez który rzucający będzie czekał za każdym razem, gdy nie znajdzie wolnego miejsca w ekwipunku, do którego rzuca, przed ponownym sprawdzeniem. Ma to na celu ograniczenie opóźnień wynikających z ciągłego sprawdzania wolnego miejsca.
RTSpillSetting=Rozrzut – Jeśli rzucony przedmiot nie zmieści się w obiekcie, na którym wylądował, upuść go na podłodze.\nRozrzuć i Oznacz – Upuść go na podłogę i oznacz, aby boty mogły go podnieść.\nZniszcz – Zniszcz przedmiot, jeśli nie zmieści się, ponosząc koszt zanieczyszczenia.
RTThrowersSetting=Włącza podstawowe funkcje miotaczy, podkładek odbijających, wyrzutni graczy i klap. Musi być włączone, aby można było tworzyć zmodyfikowane urządzenia do rzucania.
RTImpactGrouping=Maksymalna liczba pocisków tworzonych dla każdego rodzaju przedmiotu w wagonie uderzeniowym. Tworzenie mniejszej liczby pocisków pomaga zmniejszyć opóźnienia poprzez grupowanie większej liczby przedmiotów w każdym pocisku, ale wygląda to znacznie mniej efektownie.
RTShowRange=Wskaźniki zasięgu dla podkładek odbijających i ramp taśmowych w widoku alternatywnym można włączać lub wyłączać, klikając na nie. To ustawienie decyduje o tym, czy są one domyślnie widoczne, czy nie, gdy są budowane po raz pierwszy.
RTChestPop=Połowa przedmiotów w skrzyni lub pojeździe wyskoczy i rozrzuci się po ziemi, gdy zostaną one zniszczone.
RTTrapdoorSetting=Jeśli rampy kolejowe są włączone, włącza również rampy z przełącznikami klap.
MiningSpeedDebuffTime=Po usunięciu czegoś, co często nakłada się na inne elementy (włazy, rampy kolejowe), spowalnia prędkość wydobywania na ten czas, aby zapobiec przypadkowemu usunięciu obiektu znajdującego się pod spodem.
RTZiplineDisablesBotsSetting=Czy wejście na tyrolkę automatycznie wyłącza osobiste roboporty. Jeśli opcja jest włączona, po zejściu z tyrolki ustawienia osobistego roboportu zostaną przywrócone do stanu sprzed wejścia na tyrolkę.

