[entity-description]
RTBouncePlate=Przedmioty lub gracze rzuceni na podkładkę odbijającą odbiją się do przodu o kolejne 10 kafelków. Działa we wszystkich 4 kierunkach. Kliknij, aby przełączyć widoczność zasięgu w widoku alternatywnym, i naciśnij Interakcja (domyślnie F), aby dostosować zasięg odbicia.
BouncePlate5=Przedmioty lub gracze rzuceni na podkładkę odbijającą odbiją się do przodu o kolejne 5 kafelków. Działa we wszystkich 4 kierunkach. Kliknij, aby przełączyć widoczność zasięgu w widoku alternatywnym, i naciśnij Interakcja (domyślnie F), aby dostosować zasięg odbicia.
BouncePlate15=Przedmioty lub gracze rzuceni na podkładkę odbijającą odbiją się do przodu o kolejne 15 kafelków. Działa we wszystkich 4 kierunkach. Kliknij, aby przełączyć widoczność zasięgu w widoku alternatywnym, i naciśnij Interakcja (domyślnie F), aby dostosować zasięg odbicia.
PrimerBouncePlate=Granaty, kapsuły, miny lądowe, rakiety, pociski i inne przedmioty zostaną przygotowane do aktywacji po odbiciu się od tej powierzchni. Dodatkowa moc zwiększa zasięg do 40 pól. Przedmioty, których nie można przygotować do aktywacji, odbijają się tylko na 10 pól.\nNaciśnij „Interakcja” (domyślnie F), aby przełączyć się do trybu rozrzutu. Kliknij, aby włączyć/wyłączyć widoczność zasięgu w widoku alternatywnym.
PrimerSpreadBouncePlate=Granaty, kapsuły, miny lądowe, rakiety, pociski i inne przedmioty zostaną przygotowane do aktywacji po odbiciu się od tej powierzchni. Dodatkowa moc zwiększa zasięg do 37-40 pól przy rozrzucie 40 pól. Przedmioty, których nie można przygotować do detonacji, odbijają się tylko o 10 pól. Naciśnij „Interakcja” (domyślnie F), aby przełączyć się do trybu precyzyjnego. Kliknij, aby włączyć/wyłączyć widoczność zasięgu w widoku alternatywnym.
SignalBouncePlate=Działa jak stały kombinator. Sygnał włącza się/wyłącza, gdy przedmioty lub gracze odbijają się od niego. Kliknij, aby włączyć/wyłączyć widoczność zasięgu w widoku alternatywnym.
DirectedBouncePlate=Działa jak zwykła podkładka odbijająca, ale z kierunkiem. Odbija na odległość 10 kafelków. Kliknij, aby włączyć/wyłączyć widoczność zasięgu w widoku alternatywnym, i naciśnij Interakcja (domyślnie F), aby dostosować zasięg odbicia.
DirectedBouncePlate5=Działa jak zwykła podkładka odbijająca, ale z kierunkiem. Odbija na odległość 5 kafelków. Kliknij, aby włączyć/wyłączyć widoczność zasięgu w widoku alternatywnym, i naciśnij Interakcja (domyślnie F), aby dostosować zasięg odbicia.
DirectedBouncePlate15=Działa jak zwykła podkładka odbijająca, ale z kierunkiem. Odbija na odległość 15 kafelków. Kliknij, aby włączyć/wyłączyć widoczność zasięgu w widoku alternatywnym, i naciśnij Interakcja (domyślnie F), aby dostosować zasięg odbicia.
DirectorBouncePlate=Podkładka odbijająca kierunkowa potrafi w jakiś sposób rozróżniać przedmioty, które na niej lądują, i odbijając je w różnych kierunkach w zależności od tego, jak ją zaprogramujesz. Kliknij, aby ustawić filtry przedmiotów.

OpenContainer=Żelazna skrzynia bez pokrywy, dzięki czemu przedmioty mogą do niej wpadać.

PlayerLauncher=Stań na niej i naciśnij klawisz interakcji (domyślnie F), aby wystrzelić się do przodu o 10 kafelków. Wyląduj na podkładce odbijającej, aby skoczyć jeszcze dalej.

HatchRT=Zainstaluj właz na obiektach z ekwipunkiem, aby umożliwić wpadanie do nich rzucanych przedmiotów.
RTThrower-EjectorHatchRT=Właz, który zamiast przyjmować przedmioty do obiektu, na którym jest umieszczony, wyrzuca przedmioty znajdujące się w środku na odległość 20 kafelków.\nSTRZAŁKA UPADKU, GDY UMIESZCZENIE NIE JEST DOKŁADNE ZE WZGLĘDU NA OGRANICZENIA NAKŁADANE PRZEZ FACTORIO, po zbudowaniu przyciągnie się do zasięgu 20.
RTVacuumHatch=Klapa zgrubnie przymocowana do pompy. Wysysa przedmioty z podłogi z obszaru 5x5 przed sobą i wrzuca je do tego, co znajduje się za nią.

RTTrainRamp=Pociąg ruszający z tej rampy ma „aktualny cel podróży” w rozkładzie przesuniętym o jeden przystanek do przodu. Pozwala to skierować pociągi automatyczne na wybraną rampę za pomocą przystanku kolejowego umieszczonego za rampą, bez zakłócania zamierzonej trasy. Naciśnij klawisz interakcji (domyślnie F), aby wyłączyć tę funkcję pomijania przystanków, gdy nie jest potrzebna.\nPamiętaj, że pociąg może zwolnić, jeśli zbliża się do przystanku lub jeśli następny przystanek po skoku nie jest łatwo dostępny. Prędkość pociągu w momencie uderzenia w rampę decyduje o tym, jak daleko poleci. Pociągi muszą uderzyć w rampę dokładnie prosto.
RTTrainRampNoSkip=Pociąg startujący z tej rampy NIE wpływa na „aktualny cel podróży” w swoim rozkładzie. Naciśnij Interakcja, aby przywrócić tryb pomijania. Pamiętaj, że pociąg może zwolnić, jeśli zbliża się do przystanku lub jeśli następny przystanek po skoku nie jest łatwo dostępny. Prędkość pociągu w momencie uderzenia w rampę decyduje o tym, jak daleko poleci. Pociągi muszą uderzyć w rampę dokładnie prosto.
RTTrainBouncePlate=Pociągi lądujące na tych powiększonych podkładkach odbijających odbiją się ponownie do przodu. Nadal trochę kapryśne, dodane głównie dla memów.
RTTrainDirectedBouncePlate=Działa jak zwykła podkładka odbijająca z kierunkiem, ale dla pociągów. Nadal jest to dość kapryśne, dodane głównie dla memów.
RTMagnetTrainRamp=Kliknij tę opcję, aby ustawić miejsce, w którym pociągi zjeżdżające z tej rampy mają wylądować. Potężne elektromagnesy skierują wagony pociągu do wybranego punktu lądowania, zużywając przy tym około 200 kJ na kafelek za każdy narysowany skok, pobierane jednorazowo z bufora rampy. Aby magnesy działały, bufor musi być pełny, w przeciwnym razie rampa będzie działać jak zwykła rampa. Podczas łączenia skoków z rampy w sekwencję upewnij się, że co najmniej jeden wagon znajduje się w pełni na ziemi przez cały czas. Pociągi pomijają zaplanowany przystanek podczas zeskakiwania z tej rampy, przełączane za pomocą Interakcji (domyślnie F)
RTMagnetTrainRampNoSkip=Kliknij tutaj, aby ustawić miejsce, w którym pociągi zeskakujące z tej rampy mają wylądować. Potężne elektromagnesy poprowadzą wagony pociągu do pożądanego punktu lądowania, zużywając około 200 kJ na kafelek na skok, pobierane jednorazowo z bufora rampy. Bufor musi być pełny, aby magnesy działały, w przeciwnym razie rampa będzie działać jak zwykła rampa. Podczas łączenia skoków z rampy w sekwencję upewnij się, że przynajmniej jeden wagon jest przez cały czas całkowicie na ziemi. Pociągi NIE pomijają zaplanowanego przystanku podczas zeskakiwania z tej rampy (Włączane za pomocą Interakcji)
RTMagnetRail=Potężny elektromagnes sterowany przez magnetyczną rampę pociągu. Odpycha lub przyciąga wagony pociągu, pomagając im osiągnąć żądany zasięg skoku. Cząsteczki są wizualizacją pola magnetycznego. Prawdopodobnie.
RTMagnetRampDrain=Ten bufor zasila podkładki elektromagnetyczne przymocowane do jego rampy magnetycznej, przekazując całą swoją energię do podkładek podczas skoku. Wielkość bufora jest proporcjonalna do odległości skoku, a bufor napełnia się do poziomu 40 MW.
RTImpactUnloader=Gdy pociąg zderzy się z tym elementem, wszystkie przyczepione wagony uderzeniowe otwierają swoje klapy, powodując wyrzucenie ich zawartości. Im szybsze zderzenie, tym więcej przedmiotów wyleci i tym dalej polecą. Po uderzeniu „aktualny cel podróży” pociągu w rozkładzie jazdy zostaje przesunięty o jeden przystanek do przodu, co pozwala na automatyzację przy użyciu przystanku kolejowego umieszczonego za rozładowarką uderzeniową oraz lokomotywy w pociągu skierowanej tyłem do kierunku jazdy. Maksymalną liczbę tworzonych pocisków można dostosować w ustawieniach modyfikacji.
RTSwitchTrainRamp=Działa jak zwykła rampa kolejowa, ale dodatkowo przełącza stan wagonów z klapą, które z niej zeskakują. Wagon z klapą przełączony w ten sposób powróci do poprzedniego stanu po wylądowaniu.
RTSwitchTrainRamp-placer=Działa jak zwykła rampa kolejowa, ale dodatkowo przełącza stan wagonów z klapą, które z niej zeskakują. Wagon z klapą przełączony w ten sposób powróci do poprzedniego stanu po wylądowaniu.
RTSwitchTrainRampNoSkip=Działa jak zwykła rampa kolejowa bez pomijania, ale dodatkowo przełącza stan wagonów z klapą, które z niej zeskakują. Wagon z klapą przełączony w ten sposób powróci do poprzedniego stanu po wylądowaniu.
RTMagnetSwitchTrainRamp=Działa jak zwykła magnetyczna rampa dla pociągu, ale dodatkowo przełącza stan wagonów z klapą, które z niej zeskakują. Wagon z klapą przełączony w ten sposób powróci do poprzedniego stanu po wylądowaniu.
RTMagnetSwitchTrainRamp-placer=Działa jak zwykła magnetyczna rampa dla pociągu, ale dodatkowo przełącza stan wagonów z klapą, które z niej zeskakują. Wagon z klapą przełączony w ten sposób powróci do poprzedniego stanu po wylądowaniu.
RTMagnetSwitchTrainRampNoSkip=Działa jak zwykła zwykła magnetyczna rampa dla pociągów bez pomijania, ale dodatkowo zmienia stan wagonów z klapą, które z niej zeskakują. Wagon z klapą, którego stan został zmieniony w ten sposób, powróci do poprzedniego stanu po wylądowaniu.
RTTrapdoorSwitch=Przełącznik, który zmienia stan otwarcia/zamknięcia wagonów z klapą przejeżdżających po nim.
RTTrapdoorSwitch-placer=Przełącznik, który zmienia stan otwarcia/zamknięcia wagonów z klapą, które przejeżdżają po nim.

RTTrainRamp-placer=Pociąg startujący z tej rampy ma „aktualny cel podróży” w swoim rozkładzie przesunięty o jeden przystanek do przodu. Pozwala to skierować pociągi automatyczne na wybraną rampę za pomocą przystanku kolejowego umieszczonego za rampą, bez zakłócania zamierzonej trasy. Naciśnij Interakcja (domyślnie F), aby wyłączyć pomijanie rozkładu jazdy, gdy nie jest to potrzebne. Pamiętaj, że pociąg może zwolnić, jeśli zbliża się do przystanku lub jeśli następny przystanek po skoku nie jest łatwo dostępny. Prędkość pociągu w momencie uderzenia w rampę decyduje o tym, jak daleko poleci. Pociągi muszą uderzyć w rampę dokładnie prosto.
RTMagnetTrainRamp-placer=Kliknij tę opcję, aby ustawić miejsce, w którym pociągi zjeżdżające z tej rampy mają wylądować. Potężne elektromagnesy skierują wagony pociągu do wybranego punktu lądowania, zużywając przy każdym skoku około 200 kJ na kafelek, pobierane jednorazowo z bufora rampy. Aby magnesy działały, bufor musi być pełny, w przeciwnym razie rampa będzie działać jak zwykła rampa. Podczas łączenia skoków z rampy w sekwencję upewnij się, że co najmniej jeden wagon znajduje się w pełni na ziemi przez cały czas. Pociągi pomijają zaplanowany przystanek podczas zeskakiwania z tego elementu (włączane/wyłączane za pomocą Interakcji).
RTImpactUnloader-placer=Kiedy pociąg zderza się z tym elementem, wszystkie podłączone wagony uderzeniowe otwierają swoje klapy, powodując wyrzucenie ich zawartości. Im szybsze zderzenie, tym więcej przedmiotów wyleci i tym dalej polecą. Po zderzeniu „aktualny cel podróży” pociągu w rozkładzie zostaje przesunięty o jeden przystanek do przodu, co pozwala na automatyzację przy użyciu przystanku kolejowego umieszczonego za rozładowarką uderzeniową oraz lokomotywy w pociągu skierowanej tyłem do kierunku jazdy. Maksymalną liczbę tworzonych pocisków można dostosować w ustawieniach modyfikacji.

RTPayloadWagon=Gdy ten wagon uderza o ziemię, przedmioty wewnątrz, które można odpalić, ulegają zapłonowi i wylatują w promieniu 10 kafelków. Materiały wybuchowe (w sensie przedmiotu o nazwie „materiały wybuchowe”, a nie „rzeczy, które wybuchają”) w wagonie zwiększają promień rozrzutu o 0,2 kafelka, z maksymalnym limitem +30 kafelków przy 150 materiałach wybuchowych. Aby ograniczyć opóźnienia, wyleci tylko 1 pełny stos każdego przedmiotu z wagonu, który można zapalić.
RTImpactWagon=Gdy pociąg z tymi wagonami zderzy się z rozładowarką uderzeniową, wszystkie podłączone wagony uderzeniowe otwierają swoje klapy, powodując wyrzucenie ich zawartości. Im większa prędkość zderzenia, tym więcej przedmiotów zostanie wyrzuconych i tym dalej polecą. Maksymalną liczbę wyrzucanych przedmiotów można dostosować w ustawieniach modyfikacji, aby ograniczyć opóźnienia.
RTTrapdoorWagon=Gdy klapa w tym wagonie jest otwarta, jego ładunek wypada na zewnątrz.

RTZiplineTerminal=Jeśli masz wyposażony programowalny kontroler tyrolki, możesz kliknąć na ten terminal, aby zaprogramować kontroler ścieżką do dowolnego innego terminala w tej samej sieci, co pozwoli mu automatycznie sterować wózkiem tyrolki do tego miejsca.

RTThrower-PrimerThrower=Hybryda miotacza i wieżyczki! Ten miotacz może rzucać w przeciwników przedmiotami, które można odpalić (granaty, kapsuły, rakiety itp.). Będzie on wyprzedzał swoje strzały w stosunku do ruchomych celów, więc może potencjalnie spowodować ostrzał własnych sił nieco za zasięgiem celowania.

RTBeltRamp=Ten szybki nachylony przenośnik taśmowy nieustannie wyrzuca przedmioty z końca. Kliknij, aby włączyć/wyłączyć widoczność zasięgu w widoku alternatywnym.
RTfastBeltRamp=Ten superszybki nachylony przenośnik taśmowy nieustannie wyrzuca przedmioty z końca. Kliknij, aby włączyć/wyłączyć widoczność zasięgu w widoku alternatywnym.
RTexpressBeltRamp=Ten szalenie szybki nachylony przenośnik taśmowy nieustannie wyrzuca przedmioty z końca. Kliknij, aby włączyć/wyłączyć widoczność zasięgu w widoku alternatywnym.
RTturboBeltRamp=Ten hiperszybki nachylony przenośnik taśmowy nieustannie wyrzuca przedmioty z końca. Kliknij, aby włączyć/wyłączyć widoczność zasięgu w widoku alternatywnym.

RTItemCannon=Ładuje przedmioty do pocisków i niemal natychmiast przyspiesza je do absurdalnych prędkości, wyrzucając je z lufy za pomocą potężnych elektromagnesów i nadprzewodników. Strzela wyłącznie PEŁNYMI stosami. Każdy strzał zużywa cały zapas energii, który należy naładować przed kolejnym wystrzałem. Naciśnij przycisk interakcji, aby włączyć lub wyłączyć laser naprowadzający armaty.
RTRicochetPanel=Odbija pociski z przedmiotami wystrzelone z elektromagnetycznych armat przedmiotowych za pomocą skupionych impulsów naładowanych pól magnetycznych. Każdy impuls zużywa bufor mocy. Jeśli poziom bufora mocy jest niższy niż 75% w momencie uderzenia pocisku z przedmiotem, może nie wystarczyć mocy, aby bezpiecznie go odbić.
RTCatchingChute=Łapie pociski z przedmiotami w locie i umieszcza zawarte w nich przedmioty w dołączonej skrzyni.
RTMergingChute=Łączy trajektorie lotu pocisków z przedmiotami nadlatujących z dwóch różnych kierunków, przekierowując je do tego samego portu wyjściowego. Jeśli poziom zasilania jest niższy niż 75% w momencie uderzenia pocisku z przedmiotem, może nie wystarczyć mocy, aby bezpiecznie go przekierować.
RTDivergingChute=Pociski z przedmiotami wlatujące do portu wejściowego na przemian wychodzą przez dwa porty wyjściowe. Jeśli poziom zasilania jest niższy niż 75% w momencie uderzenia pocisku z przedmiotem, urządzenie może nie mieć wystarczającej mocy, aby bezpiecznie go przekierować.


