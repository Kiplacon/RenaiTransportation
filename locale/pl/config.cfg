[virtual-signal-description]
DirectorBouncePlateUp=Umieść przedmiot w tym slocie, aby odbił się w górę po wylądowaniu na tej podkładce odbijającej
DirectorBouncePlateRight=Umieść przedmiot w tym slocie, aby odbił się w prawo po wylądowaniu na tej podkładce odbijającej
DirectorBouncePlateDown=Umieść przedmiot w tym slocie, aby odbił się w dół po wylądowaniu na tej podkładce odbijającej
DirectorBouncePlateLeft=Umieść przedmiot w tym slocie, aby odbił się w lewo po wylądowaniu na tej podkładce odbijającej
ThrowerRangeSignal=Miotacze odbierające ten sygnał dostosują swój zasięg do wartości sygnału. Jeśli sygnał ten jest podłączony zarówno do czerwonego, jak i zielonego przewodu, wartości zostaną zsumowane. Zasięg nie może zostać dostosowany poza limit miotacza.
StationTrapdoorWagonSignal=Jeśli przystanek pociągu ma podłączony ten sygnał [virtual-signal=StationTrapdoorWagonSignal], wszystkie wagony z klapami w pociągach, które się na nim zatrzymają, przełączą swój stan otwarcia/zamknięcia po przyjeździe i przełączą się z powrotem przy odjeździe.

[magnet-ramp-stuff]
