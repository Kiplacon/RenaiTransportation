[item-description]
RTZiplineTrolley=Ten zmotoryzowany wózek linowy porusza się dzięki prądowi płynącemu przez kabel, po którym się porusza. Wyposaż go w kontroler, wybierz go i naciśnij klawisz Tyrolki (domyślnie F) na słupie energetycznym, aby rozpocząć jazdę, a następnie ponownie użyj interakcji, aby zeskoczyć. Samoczynnie zsiada się na ślepych końcach.\nZużywa 450 kW energii.
RTZiplineTrolley2=Dwa razy szybszy niż zwykły wózek linowy! Zużywa 1 MW energii. Projektowanie graficzne to moja pasja :)
RTZiplineTrolley3=Dwa razy szybszy niż Szybki wózek linowy! Zużywa 5 MW energii.
RTZiplineTrolley4=Dwa razy szybszy niż Błyskawiczny wózek linowy! Zużywa 10 MW energii.
RTZiplineTrolley5=O wiele szybszy niż Ekspresowy wózek linowy! Czy w ogóle da się nim sterować przy takiej prędkości? Zużywa 50 MW energii.
RTZiplineControls=Wyposaż Elektryczny wózek linowy w slocie amunicji, aby kontrolować jego ruch.
RTZiplineCrankControls=Przytrzymaj klawisz strzału podczas zjazdu na linie, aby uzyskać dodatkowy zastrzyk prędkości. Może to napędzać linę nawet wtedy, gdy w sieci nie ma zasilania. Po pewnym czasie wymaga wymiany.
RTProgrammableZiplineControls=Te kontrolery można zaprogramować tak, aby automatycznie przewoziły cię między dowolnymi dwoma terminalami tyrolki bez konieczności sterowania.
RTLickmawBalls=Ten soczysty owoc jest wielkim hitem na Sawconie.\n\nPodczas sesji pytań i odpowiedzi z twórcami na imprezie LAN Space Age ujawniono, że w pewnym momencie rozwoju gry elementy te faktycznie w niej występowały. Krytycy uważają ich usunięcie za zdecydowanie największą wpadkę tego dodatku i jedyną rzecz, która uniemożliwia mu zdobycie wielowymiarowego uznania.
RTAIZiplineControls=Ten kontroler pozwala sterować elektryczną tyrolką do dowolnego słupa energetycznego w sieci. Będąc na tyrolce, najedź kursorem na dowolny słup i naciśnij klawisz tyrolki, aby automatycznie się tam przenieść.

RTItemShellItem=Służy do wystrzeliwania stosów przedmiotów z elektromagnetycznych armat przedmiotowych


